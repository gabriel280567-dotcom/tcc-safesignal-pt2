<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crie sua conta — SafeSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="signup-page">

<main class="signup-wrap">
  <div class="container signup-container">

    <div class="signup-header">
      <a href="index.html" class="logo logo-center">
        <svg width="34" height="34" viewBox="0 0 30 30" fill="none"><path d="M15 26.5s-11-6.9-11-14.7C4 7.6 7 5 10.3 5c2.1 0 3.9 1.1 4.7 2.8C15.8 6.1 17.6 5 19.7 5 23 5 26 7.6 26 11.8 26 19.6 15 26.5 15 26.5z" fill="#1B5E3B"/><path d="M6 14h4l2-5 3 10 2-5h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>SafeSignal</span>
      </a>
      <h1>Crie sua conta</h1>
      <p>Preencha os dados abaixo para começar sua jornada para uma vida mais saudável.</p>
    </div>

    <form class="signup-form" id="signupForm" novalidate>

      <div class="signup-row">
        <div class="field">
          <label for="fullName"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#1B5E3B" stroke-width="1.6"/><path d="M5 20c1.2-3.8 4.2-6 7-6s5.8 2.2 7 6" stroke="#1B5E3B" stroke-width="1.6" stroke-linecap="round"/></svg> Nome completo</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div class="field">
          <label for="birthDate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="#1B5E3B" stroke-width="1.6"/><path d="M4 10h16M8 3.5v3M16 3.5v3" stroke="#1B5E3B" stroke-width="1.6" stroke-linecap="round"/></svg> Data de nascimento</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>
      </div>

      <div class="signup-row">
        <div class="field">
          <label for="email"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="#1B5E3B" stroke-width="1.6"/><path d="M4.5 7l7.5 6 7.5-6" stroke="#1B5E3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2" stroke="#1B5E3B" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#1B5E3B" stroke-width="1.6"/></svg> Senha</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>
      </div>

      <div class="signup-row single">
        <div class="field">
          <label for="phone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 4.5h3.4l1.4 4-2 1.5c.9 2.1 2.6 3.8 4.7 4.7l1.5-2 4 1.4V17.5c0 1.1-.9 2-2 2C10.6 19.5 4.5 13.4 4.5 6.5c0-1.1.9-2 2-2z" stroke="#1B5E3B" stroke-width="1.6" stroke-linejoin="round"/></svg> Telefone</label>
          <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
        </div>
      </div>

      <fieldset class="conditions">
        <legend>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-8-4.9-8-10.6C4 6.7 6.3 4.6 9 4.6c1.4 0 2.7.7 3 2 .3-1.3 1.6-2 3-2 2.7 0 5 2.1 5 5.3 0 5.7-8 10.6-8 10.6z" stroke="#1B5E3B" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 11h3l1.7-3.6L12.5 15l1.6-4h3.4" stroke="#1B5E3B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Condições físicas
        </legend>
        <p class="conditions-hint">Possui alguma condição de saúde, limitação física ou questão que devemos considerar para recomendarmos os exercícios mais adequados para você?</p>

        <div class="conditions-grid">
          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="mobilidade-reduzida">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="16" r="4" stroke="#1B5E3B" stroke-width="1.5"/><circle cx="8" cy="4.5" r="1.6" fill="#1B5E3B"/><path d="M8 6.5v5l4 2 3 5M8 9h6l2.5 3" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span><strong>Mobilidade reduzida</strong>Dificuldade de locomoção ou movimentação.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="problemas-coluna">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M9 6h6M9 10h6M9 14h6M9 18h6" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span><strong>Problemas na coluna</strong>Hérnia de disco, lombalgia, cervicalgia, entre outras.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="problemas-cardiacos">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-8-4.9-8-10.6C4 6.7 6.3 4.6 9 4.6c1.4 0 2.7.7 3 2 .3-1.3 1.6-2 3-2 2.7 0 5 2.1 5 5.3 0 5.7-8 10.6-8 10.6z" stroke="#1B5E3B" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 11h3l1.7-3.6L12.5 15l1.6-4h3.4" stroke="#1B5E3B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span><strong>Problemas cardíacos</strong>Hipertensão, arritmia, insuficiência cardíaca, etc.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="problemas-respiratorios">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3v6" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/><path d="M12 9c-1.5 0-4 1-4 5 0 3-1.5 4-3 4-1 0-1.5-1-1.5-2" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/><path d="M12 9c1.5 0 4 1 4 5 0 3 1.5 4 3 4 1 0 1.5-1 1.5-2" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span><strong>Problemas respiratórios</strong>Asma, bronquite, DPOC, entre outras.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="problemas-articulacoes">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 12h4M14 12h4" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="#1B5E3B" stroke-width="1.5"/></svg>
            <span><strong>Problemas nas articulações</strong>Artrose, artrite, bursite, tendinite, etc.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="diabetes">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3s6 7.5 6 12a6 6 0 0 1-12 0c0-4.5 6-12 6-12z" stroke="#1B5E3B" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span><strong>Diabetes</strong>Diabetes tipo 1 ou tipo 2.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="problemas-neurologicos">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 4.5c-2 0-3.5 1.6-3.5 3.4 0 .8.3 1.5.7 2-1 .5-1.7 1.5-1.7 2.7 0 1.3.8 2.4 2 2.8-.1.3-.2.7-.2 1.1 0 1.9 1.6 3.5 3.5 3.5.6 0 1.1-.1 1.6-.4V6.3c0-1-.9-1.8-2-1.8z" stroke="#1B5E3B" stroke-width="1.4" stroke-linejoin="round"/><path d="M15 4.5c2 0 3.5 1.6 3.5 3.4 0 .8-.3 1.5-.7 2 1 .5 1.7 1.5 1.7 2.7 0 1.3-.8 2.4-2 2.8.1.3.2.7.2 1.1 0 1.9-1.6 3.5-3.5 3.5-.6 0-1.1-.1-1.6-.4V6.3c0-1 .9-1.8 2-1.8z" stroke="#1B5E3B" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span><strong>Problemas neurológicos</strong>Epilepsia, Parkinson, enxaqueca, AVC.</span>
          </label>

          <label class="condition-card">
            <input type="checkbox" name="condicoes" value="pos-cirurgico">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3.4 8.4-7 10-3.6-1.6-7-5-7-10V6l7-3z" stroke="#1B5E3B" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 12h6M12 9v6" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span><strong>Pós-cirúrgico / Reabilitação</strong>Em recuperação de cirurgias ou tratamentos.</span>
          </label>

          <label class="condition-card condition-other">
            <input type="checkbox" id="otherConditionCheck" name="condicoes" value="outra">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1B5E3B" stroke-width="1.5"/><path d="M12 8v8M8 12h8" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span><strong>Outra condição</strong>Digite abaixo sua condição ou observação.</span>
          </label>
        </div>

        <textarea id="otherConditionText" name="outraCondicao" placeholder="Descreva sua condição ou observação (opcional)" rows="3"></textarea>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Criar conta</button>
      <p class="signup-login-link">Já tem uma conta? <a href="index.html#login">Entrar</a></p>
    </form>

  </div>
</main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
